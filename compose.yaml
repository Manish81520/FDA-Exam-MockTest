services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/mock.db
      EXAMS_DIR: /data/exams
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
    ports:
      - "${PORT:-8001}:8000"
    volumes:
      - clean-data:/data

volumes:
  clean-data:
